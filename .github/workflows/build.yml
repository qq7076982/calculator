name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Flutter SDK
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git /opt/flutter
          echo "/opt/flutter/bin" >> $GITHUB_PATH

      - name: Setup Flutter
        run: flutter precache

      - name: Fix repository mirrors (remove aliyun)
        run: |
          sed -i 's|maven { url = uri("https://maven.aliyun.com/repository/google") }||g' android/build.gradle.kts
          sed -i 's|maven { url = uri("https://maven.aliyun.com/repository/jcenter") }||g' android/build.gradle.kts
          sed -i 's|maven { url = uri("https://maven.aliyun.com/repository/central") }||g' android/build.gradle.kts
          sed -i '/^[[:space:]]*$/d' android/build.gradle.kts

      - name: Get dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m -Dorg.gradle.daemon=false"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: build/app/outputs/flutter-apk/app-debug.apk